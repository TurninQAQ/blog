limit_req_zone $binary_remote_addr zone=blog_public:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=blog_connections:10m;

upstream personal_blog {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 175.178.128.135;
    server_tokens off;

    if ($host != 175.178.128.135) {
        return 444;
    }

    client_max_body_size 11m;
    client_body_timeout 60s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 60s;
    limit_conn blog_connections 30;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_hide_header X-Powered-By;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /admin {
        return 403;
    }

    location ^~ /api/admin/ {
        return 403;
    }

    location = /__skeleton {
        return 404;
    }

    location = /api/skeleton-probe {
        return 404;
    }

    location / {
        limit_req zone=blog_public burst=60 nodelay;
        proxy_pass http://personal_blog;
    }
}
