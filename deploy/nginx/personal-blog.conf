limit_req_zone $binary_remote_addr zone=blog_public:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=blog_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=blog_admin:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=blog_connections:10m;

upstream personal_blog {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 175.178.128.135;
    server_tokens off;

    if ($host != 175.178.128.135) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 308 https://175.178.128.135$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 175.178.128.135;
    server_tokens off;

    if ($host != 175.178.128.135) {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/175.178.128.135/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/175.178.128.135/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:blog_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 11m;
    client_body_timeout 60s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 60s;
    limit_conn blog_connections 30;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_hide_header X-Powered-By;

    location = /admin/login {
        limit_req zone=blog_login burst=5 nodelay;
        proxy_pass http://personal_blog;
    }

    location ^~ /api/admin/ {
        limit_req zone=blog_admin burst=20 nodelay;
        proxy_pass http://personal_blog;
    }

    location = /__skeleton {
        return 404;
    }

    location = /api/skeleton-probe {
        return 404;
    }

    location / {
        limit_req zone=blog_public burst=60 nodelay;
        proxy_pass http://personal_blog;
    }
}
