name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      POSTGRES_DB: personal_blog_ci
      POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      POSTGRES_USER: blog_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: personal_blog_ci
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_USER: blog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog_ci -d personal_blog_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Create disposable test environment
        shell: bash
        run: |
          set -euo pipefail
          admin_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          admin_hash="$(printf '%s' "$admin_password" | npm run --silent admin:hash-password)"
          session_secret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          connection_url="$(node -e 'const user = encodeURIComponent(process.env.POSTGRES_USER); const pass = encodeURIComponent(process.env.POSTGRES_PASSWORD); process.stdout.write(["postgresql://", user, ":", pass, "@127.0.0.1:5432/", process.env.POSTGRES_DB, "?schema=public"].join(""))')"

          echo "::add-mask::$admin_password"
          echo "::add-mask::$admin_hash"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$connection_url"
          {
            printf 'DATABASE_URL=%s\n' "$connection_url"
            printf 'ADMIN_EMAIL=%s\n' 'ci-admin@example.invalid'
            printf 'ADMIN_PASSWORD_HASH=%s\n' "$admin_hash"
            printf 'ADMIN_SESSION_SECRET=%s\n' "$session_secret"
            printf 'PLAYWRIGHT_ADMIN_PASSWORD=%s\n' "$admin_password"
          } >> "$GITHUB_ENV"

      - name: Apply migrations and bootstrap administrator
        run: |
          npm run db:migrate:deploy
          npm run admin:bootstrap

      - name: Run base verification
        run: |
          echo "::group::Repository verification"
          npm run verify:ci
          echo "::endgroup::"

      - name: Run headed browser flows
        run: |
          echo "::group::Four-project Playwright suite"
          xvfb-run --auto-servernum npm run test:e2e -- --headed
          echo "::endgroup::"

      - name: Run production security evidence
        run: |
          echo "::group::Production security smoke"
          xvfb-run --auto-servernum npm run security:smoke
          echo "::endgroup::"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
